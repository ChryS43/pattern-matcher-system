apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: pattern-matcher-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: christiandenisi/eureka-server:dev
          ports:
            - containerPort: 8761
          envFrom:
            - configMapRef:
                name: eureka-server-config

apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: pattern-matcher-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
      - name: config-server
        image: christiandenisi/config-server:dev 
        ports:
        - containerPort: 8888
        envFrom:
        - configMapRef:
            name: config-server-config

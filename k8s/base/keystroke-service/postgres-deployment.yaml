apiVersion: apps/v1
kind: Deployment
metadata:
  name: keystroke-db
  namespace: pattern-matcher-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keystroke-db
  template:
    metadata:
      labels:
        app: keystroke-db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "keystroke_db"
            - name: POSTGRES_USER
              value: "dev"
            - name: POSTGRES_PASSWORD
              value: "dev"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: keystroke-postgres-pvc 
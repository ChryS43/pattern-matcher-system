server.port=8082

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://keystroke-db:5432/keystroke_db}
spring.datasource.username=${DB_USERNAME:dev}
spring.datasource.password=${DB_PASSWORD:dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=true

# Queue
keystroke.queue.name=keystroke-queue

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_URI:http://eureka-server:8761/eureka}
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.hostname}:${random.value}
eureka.instance.prefer-ip-address=true

debug=${DEBUG:true}


# -----------------------------------------------
# Eureka Server - Application Configuration
# -----------------------------------------------

spring.application.name=${SPRING_APPLICATION_NAME:eureka-server}
server.port=${SERVER_PORT:8761}

# -----------------------------------------------
# Eureka Standalone Mode
# -----------------------------------------------

eureka.client.register-with-eureka=${REGISTER_WITH_EUREKA:false}
eureka.client.fetch-registry=${FETCH_REGISTRY:false}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:eureka-server}

spring.cloud.service-registry.auto-registration.enabled=${AUTO_REGISTRATION_ENABLED:false}
